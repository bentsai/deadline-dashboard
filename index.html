<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>What &amp; When</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#000">
  <meta name="description" content="What &amp; When — a personal dashboard for your due dates and top-of-mind projects">
  <link rel="icon" href="apple-touch-icon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta property="og:title" content="What &amp; When">
  <meta property="og:description" content="A personal dashboard for your due dates and top-of-mind projects">
  <meta property="og:image" content="https://whatandwhen.fyi/og-image.png">
  <meta property="og:url" content="https://whatandwhen.fyi/">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,400&family=IBM+Plex+Mono:wght@400;700&family=Rubik:wght@400;700;900&family=Rubik+Mono+One&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,400&family=IBM+Plex+Mono:wght@400;700&family=Rubik:wght@400;700;900&family=Rubik+Mono+One&display=swap"></noscript>
  <style>
    :root {
      color-scheme: dark;
      --bg: #000;
      --fg: #fff;
      --card-bg: #fff;
      --card-fg: #000;
      --muted: #767676;
      --border-dim: #444;
      --border-hover: #777;
      --accent: #ffcc00;
      /* bright yellow highlight on the saturated dark urgent/done cards — stays bright in both themes */
      --accent-bright: #ffcc00;
      --danger: #ff0000;
      --urgent-bg: #cc2200;
      --soon-bg: #ffcc00;
      --soon-fg: #4a4a00;
      --past-bg: #2e2e2e;
      --past-fg: #b0b0b0;
      --done-bg: #1a7a3a;
      /* white text on saturated (urgent/done) cards — stays white in both themes */
      --on-color: #fff;
      --on-dark: rgba(255,255,255,.85);
      --on-dark-muted: rgba(255,255,255,.75);
      --on-dark-dim: rgba(255,255,255,.6);
      --what-bg: #1a1a1a;
      --what-input-bg: #111;
      --card-min-h: 240px;
      --grid-min: 380px;
      --font: "Rubik", sans-serif;
      --font-mono: "Rubik Mono One", monospace;
      --font-scratch: "IBM Plex Mono", monospace;
    }
    :root.theme-light {
      color-scheme: light;
      --bg: #ececec;
      --fg: #1a1a1a;
      --card-fg: #1a1a1a;
      --muted: #5f5f5f;
      --border-dim: #bcbcbc;
      --border-hover: #888;
      --accent: #cc6600;
      --past-bg: #dcdcdc;
      --past-fg: #595959;
      --what-bg: #f5f5f5;
      --what-input-bg: #ffffff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    button, a { cursor: pointer; }
    html { height: 100%; }
    body {
      min-height: 100%;
      font-family: var(--font);
      background: var(--bg);
      color: var(--fg);
      padding: 2rem;
    }
    .section { margin-bottom: 2rem; }
    .section:last-of-type { margin-bottom: 0; }
    .cluster {
      display: flex;
      justify-content: flex-end;
      align-items: flex-start;
      gap: .65rem;
      margin-bottom: 0.5rem;
    }
    .cluster-controls {
      display: flex;
      align-items: baseline;
      gap: .65rem;
    }
    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 1rem;
      margin-bottom: 2rem;
      border-bottom: 6px solid var(--fg);
    }
    .add-btn {
      flex: none;
      background: transparent;
      border: none;
      padding: 0 0.5rem 0 0;
      color: var(--fg);
      font: 600 3rem var(--font);
      line-height: 1;
      transition: color .15s;
    }
    .add-btn:hover { color: var(--muted); }
    .add-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .wordmark, .domain-label {
      font-family: "Fraunces", serif;
      font-weight: 400;
      font-style: italic;
      font-variation-settings: "opsz" 144;
      letter-spacing: -.01em;
      color: var(--muted);
    }
    .wordmark { font-size: 1.4rem; }
    .domain-label { font-size: 4rem; margin-right: auto; }
    .cluster-link {
      color: var(--muted);
      font-family: var(--font);
      font-size: .85rem;
      text-decoration: underline;
      background: none;
      border: none;
      padding: 0;
      transition: color .15s;
    }
    .cluster-link:hover { color: var(--fg); }
    .cluster-link:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
    .cluster-link.theme-toggle { text-decoration: none; font-size: 1rem; }
    .cluster-sep { color: var(--border-dim); }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(var(--grid-min), 100%), 1fr));
      grid-auto-rows: 1fr;
      gap: 1.5rem;
    }
    .card {
      background: var(--card-bg);
      color: var(--card-fg);
      padding: 2rem;
      border: 4px solid var(--card-fg);
      outline: 4px solid var(--card-bg);
      display: flex;
      flex-direction: column;
      gap: .75rem;
      min-height: var(--card-min-h);
      justify-content: space-between;
      position: relative;
      overflow: hidden;
      cursor: pointer;
      transition: outline-color .1s;
      contain: layout style paint;
    }
    .card .stamp { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%) rotate(-18deg); font-size: 14rem; line-height: 1; pointer-events: none; opacity: .15; z-index: 0; }
    .card.urgent .stamp { opacity: .25; }
    .card.soon .stamp { font-size: 16rem; }
    .card > *:not(.stamp) { position: relative; z-index: 1; }
    .card.urgent, .card.done {
      color: var(--on-color);
      & .card-date { color: var(--on-color); }
      & .label { color: var(--on-dark); }
      & .inline-hint { color: var(--on-dark-muted); }
      & .inline-actions button { color: var(--on-dark-muted); }
      & .inline-actions button:hover { color: var(--on-color); }
      & .inline-actions button.danger:hover { color: var(--accent-bright); }
      & .inline-input { border-color: var(--on-dark-dim); color: var(--on-color); }
      & .inline-input:focus { border-color: var(--on-color); }
    }
    .card.urgent { background: var(--urgent-bg); border-color: var(--urgent-bg); outline-color: var(--urgent-bg); }
    .card.soon {
      background: var(--soon-bg); color: var(--card-fg); border-color: var(--soon-bg); outline-color: var(--soon-bg);
      & .card-date { color: var(--soon-fg); }
      & .label { color: var(--soon-fg); }
      & .inline-actions button { color: var(--soon-fg); }
      & .inline-actions button:hover { color: var(--card-fg); }
      & .inline-actions button:focus-visible { outline-color: var(--card-fg); }
      & .inline-actions button.danger:hover { color: var(--danger); }
      & .inline-input { border-color: var(--soon-fg); color: var(--card-fg); }
      & .inline-input:focus { border-color: var(--card-fg); }
    }
    .card.past {
      background: var(--past-bg); color: var(--past-fg); border-color: var(--past-bg); outline-color: var(--muted);
      & .card-date { color: var(--past-fg); }
      & .card-days { color: var(--past-fg); }
      & .label { color: var(--past-fg); }
    }
    .card.done { background: var(--done-bg); border-color: var(--done-bg); outline-color: var(--done-bg); }
    .card-name {
      font-size: 1.4rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .05em;
      text-wrap: balance;
      line-height: 1.3;
      min-height: 3.64rem;
    }
    .card-date {
      font-family: var(--font);
      font-size: 1rem;
      font-weight: 400;
      color: var(--muted);
    }
    .card-days {
      font-family: var(--font-mono);
      font-size: 9rem;
      font-weight: 400;
      line-height: 1;
      letter-spacing: -.04em;
      position: relative;
      display: inline-block;
      margin-top: auto;
    }
    .label {
      display: block;
      font-size: 1.2rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: var(--muted);
    }
    @keyframes flash { 0% { transform: rotate(0deg); } 20% { transform: rotate(1.5deg); } 40% { transform: rotate(-1.5deg); } 60% { transform: rotate(.8deg); } 80% { transform: rotate(-.4deg); } 100% { transform: rotate(0deg); } }
    .card.flash { animation: flash .5s ease-in-out; contain: layout paint; }
    @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
    .blink-colon {
      margin-left: -.24em;
      animation: blink 2s step-end infinite;
    }
    .blink-colon.minutes { animation-duration: 1s; margin-left: -.3em; margin-right: -.24em; }
    @media (prefers-reduced-motion: reduce) {
      .blink-colon { animation: none; }
    }
    .add-card {
      background: transparent;
      border: 2px solid var(--fg);
      padding: 1.5rem;
      min-height: var(--card-min-h);
      display: flex;
      flex-direction: column;
      align-items: stretch;
      justify-content: start;
      gap: .75rem;
    }
    .inline-input {
      width: 100%;
      padding: 1rem;
      border: 2px solid var(--muted);
      background: transparent;
      color: var(--fg);
      font: 400 1.2rem var(--font);
      resize: none;
    }
    .inline-input::placeholder { color: var(--muted); font-weight: 400; font-size: 1.1rem; }
    .inline-input:focus { outline: none; border-color: var(--fg); }
    .inline-hint {
      font-family: var(--font);
      font-size: .85rem;
      font-weight: 400;
      color: var(--muted);
    }
    .inline-actions { display: flex; align-items: center; gap: .75rem; margin-top: .5rem; }
    .inline-actions button {
      padding: .4rem .75rem;
      border: none;
      background: transparent;
      color: var(--muted);
      font: 400 .95rem var(--font);
      cursor: pointer;
      text-decoration: underline;
      min-height: 44px;
      min-width: 44px;
    }
    .inline-actions button:hover { color: var(--fg); }
    .inline-actions button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .inline-actions button.card-delete { margin-left: auto; }
    .inline-actions button.danger { color: var(--muted); }
    .inline-actions button.danger:hover { color: var(--danger); }
    .card.ok {
      & .inline-actions button { color: var(--past-fg); }
      & .inline-actions button:hover { color: var(--card-fg); }
      & .inline-actions button.danger:hover { color: var(--danger); }
      & .inline-input { border-color: var(--muted); color: var(--card-fg); }
      & .inline-input:focus { border-color: var(--card-fg); }
    }
    .card:hover, .card:focus { outline-color: var(--accent-bright); }
    .card:focus { outline-style: solid; }
    .card.soon:hover, .card.soon:focus { outline-color: var(--fg); }
    .card.editing { outline-color: var(--fg); cursor: default; justify-content: center; }
    .what-card.editing { justify-content: center; }
    .what-card:focus { border-color: var(--accent); outline: 2px solid var(--accent); outline-offset: 2px; }
    h2 {
      font-size: 2.4rem;
      text-transform: uppercase;
      letter-spacing: .01rem;
      text-wrap: balance;
    }
    #words-text {
      display: block;
      width: 100%;
      min-height: 350px;
      font-family: var(--font-scratch);
      font-size: 2rem;
      background: var(--what-bg);
      color: var(--fg);
      border: 2px solid var(--border-dim);
      padding: 1.5rem;
      resize: none;
      line-height: 1.6;
    }
    #words-text::placeholder { color: var(--muted); }
    #words-text:focus { outline: none; border-color: var(--accent); }
    .what-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(var(--grid-min), 100%), 1fr));
      gap: 1.5rem;
    }
    .what-card {
      background: var(--what-bg);
      color: var(--fg);
      padding: 2rem;
      border: 2px solid var(--border-dim);
      cursor: pointer;
      min-height: var(--card-min-h);
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
      transition: border-color .15s, transform .15s;
      contain: layout style paint;
    }
    .what-card:hover { border-color: var(--accent-bright); }
    .what-card.dragging { opacity: .3; transform: scale(.95); }
    .what-card.editing { border-color: var(--fg); cursor: default; }
    .what-card .what-text {
      font-size: 3rem;
      font-weight: 400;
      line-height: 1.2;
      white-space: pre-line;
    }
    .what-card .inline-input { border-color: var(--muted); background: var(--what-input-bg); color: var(--fg); }
    .what-card .inline-input:focus { border-color: var(--accent); }
    .what-card .inline-actions button { border-color: var(--muted); color: var(--past-fg); }
    .what-card .inline-actions button:hover { border-color: var(--fg); color: var(--fg); }
    .what-card .inline-actions button.danger:hover { border-color: var(--danger); color: var(--danger); }
    #export-status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  </style>
  <script>
    // Apply saved theme before first paint to avoid a flash of the wrong theme.
    (function () {
      var saved = localStorage.getItem("whatandwhen-theme-v1");
      var light = saved ? saved === "light" : !matchMedia("(prefers-color-scheme: dark)").matches;
      if (light) document.documentElement.classList.add("theme-light");
    })();
  </script>
</head>
<body>
  <main>
    <div class="cluster">
      <div class="cluster-controls">
        <span class="wordmark">What &amp; When</span>
        <span class="cluster-sep" aria-hidden="true">·</span>
        <button class="cluster-link" id="export-btn" type="button">export</button>
        <span class="cluster-sep" aria-hidden="true">·</span>
        <button class="cluster-link theme-toggle" id="theme-btn" type="button" aria-label="Switch theme"></button>
      </div>
    </div>
    <span id="export-status" aria-live="polite"></span>
    <section class="section">
      <div class="section-head">
        <h2>What</h2>
        <button class="add-btn" id="what-add-btn" type="button" aria-label="Add item">+</button>
      </div>
      <div class="what-grid" id="what-grid"></div>
    </section>
    <section class="section">
      <div class="section-head">
        <h2>When</h2>
        <button class="add-btn" id="when-add-btn" type="button" aria-label="Add deadline">+</button>
      </div>
      <div class="grid" id="grid"></div>
    </section>
    <section class="section">
      <div class="section-head">
        <h2>Words</h2>
      </div>
      <textarea id="words-text" aria-label="Words scratch notes" placeholder="Scratch space…"></textarea>
    </section>
  </main>
  <script>
    let whatDragIdx = null;
    function formatISOLocal(dt) {
      const p = n => String(n).padStart(2, "0");
      return dt.getFullYear() + "-" + p(dt.getMonth() + 1) + "-" + p(dt.getDate())
        + "T" + p(dt.getHours()) + ":" + p(dt.getMinutes());
    }

    function makeSeed() {
      const now = new Date();
      function daysFromNow(days, hour) {
        const dt = new Date(now);
        dt.setDate(dt.getDate() + days);
        dt.setHours(hour || 9, 0, 0, 0);
        return formatISOLocal(dt);
      }
      return [
        {name: "Submit quarterly report", date: daysFromNow(-2, 17)},
        {name: "Send contract to legal", date: formatISOLocal(new Date(now.getTime() + 38 * 60000))},
        {name: "Design review with team", date: daysFromNow(1, 10)},
        {name: "Launch blog post", date: daysFromNow(5, 9)},
        {name: "Renew domain registration", date: daysFromNow(30, 9)},
        {name: "Ship v2 API docs", date: daysFromNow(-5, 9), done: true, doneAt: new Date(now.getTime() - 3 * 86400000).toISOString()}
      ];
    }

    const WHAT_SEED = [
      {text: "Prep talking points for 1:1"},
      {text: "Reply to Slack thread on launch plan"},
      {text: "Read RFC on new auth flow"}
    ];

    function domainFromHash() {
      const h = decodeURIComponent(location.hash.slice(1)).toLowerCase().trim();
      if (h.startsWith("data=")) return "";        // export/import hash, not a domain
      return h.replace(/[^a-z0-9-]/g, "");         // sanitize; empty => default domain
    }
    const DOMAIN = domainFromHash();
    function keyFor(part, domain = DOMAIN) {
      return "whatandwhen-" + (domain ? domain + "-" : "") + part + "-v1";
    }

    const KEY = keyFor("when");
    const WHAT_KEY = keyFor("what");

    // Read JSON from a key; on missing/corrupt data, seed via seedFn() and persist.
    function loadJSON(key, seedFn) {
      const raw = localStorage.getItem(key);
      if (raw) {
        try { return JSON.parse(raw); } catch(e) { console.warn("Corrupt data, reseeding", key, e); }
      }
      const seed = seedFn();
      saveJSON(key, seed);
      return seed;
    }

    function saveJSON(key, val) {
      localStorage.setItem(key, JSON.stringify(val));
    }

    function load() { return loadJSON(KEY, () => DOMAIN ? [] : makeSeed()); }
    function save(whens) { saveJSON(KEY, whens); }
    function loadWhat() { return loadJSON(WHAT_KEY, () => DOMAIN ? [] : WHAT_SEED); }
    function saveWhat(cards) { saveJSON(WHAT_KEY, cards); }

    const WORDS_KEY = keyFor("words");
    function loadWords() { return localStorage.getItem(WORDS_KEY) || ""; }
    function saveWords(text) { localStorage.setItem(WORDS_KEY, text); }

    const MS_MINUTE = 60000;
    const MS_HOUR = 3600000;
    const MS_DAY = 86400000;
    const MS_12H = 12 * MS_HOUR;

    function timeUntil(dateStr) {
      const ms = new Date(dateStr) - new Date();
      const days = Math.ceil(ms / MS_DAY);
      if (ms <= 0) return {value: Math.abs(days), unit: "days ago", days, ms};
      if (ms >= MS_DAY) return {value: days, unit: "days left", days, ms};
      if (ms >= MS_HOUR) return {value: Math.ceil(ms / MS_HOUR), unit: "hours left", days: 0, ms};
      return {value: Math.max(1, Math.ceil(ms / MS_MINUTE)), unit: "minutes left", days: 0, ms};
    }

    const MONTHS = {jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11,
      january:0,february:1,march:2,april:3,june:5,july:6,august:7,september:8,october:9,november:10,december:11};
    const DAYS = {sunday:0,monday:1,tuesday:2,wednesday:3,thursday:4,friday:5,saturday:6};

    function extractTime(str) {
      const m = str.match(/\s+(?:at\s+)?(\d{1,2})(?::(\d{2}))?\s*(am|pm)$/);
      if (m) {
        let h = parseInt(m[1]);
        const min = m[2] ? parseInt(m[2]) : 0;
        if (m[3] === "pm" && h < 12) h += 12;
        if (m[3] === "am" && h === 12) h = 0;
        return { rest: str.slice(0, m.index), hour: h, min };
      }
      const m2 = str.match(/\s+at\s+(\d{1,2}):(\d{2})$/);
      if (m2) return { rest: str.slice(0, m2.index), hour: parseInt(m2[1]), min: parseInt(m2[2]) };
      return null;
    }

    function parseDate(str) {
      const s = str.trim().toLowerCase();
      const now = new Date();
      const time = extractTime(s);
      const base = time ? time.rest : s;
      const hour = time ? time.hour : 9;
      const min = time ? time.min : 0;

      if (base === "today") return makeDate(now.getFullYear(), now.getMonth(), now.getDate(), hour, min);
      if (base === "tomorrow") {
        const d = new Date(now); d.setDate(d.getDate() + 1);
        return makeDate(d.getFullYear(), d.getMonth(), d.getDate(), hour, min);
      }
      if (base === "next week") {       // synonym for "in 1 week" — +7 days
        const d = new Date(now); d.setDate(d.getDate() + 7);
        return makeDate(d.getFullYear(), d.getMonth(), d.getDate(), hour, min);
      }

      function nearestWeekday(dayName, skip) {
        const target = DAYS[dayName];
        if (target === undefined) return null;
        const d = new Date(now);
        let diff = target - d.getDay();
        if (diff < 0) diff += 7;
        if (skip) diff += 7;
        d.setDate(d.getDate() + diff);
        return makeDate(d.getFullYear(), d.getMonth(), d.getDate(), hour, min);
      }

      const nextDay = base.match(/^next\s+(\w+)$/);
      if (nextDay) { const r = nearestWeekday(nextDay[1], true); if (r) return r; }

      const bareDay = base.match(/^(\w+)$/);
      if (bareDay) { const r = nearestWeekday(bareDay[1], false); if (r) return r; }

      for (const [name, idx] of Object.entries(MONTHS)) {
        const m = base.match(new RegExp("^" + name + "\\s+(\\d{1,2})(?:[,\\s]+(\\d{4}))?$"));
        if (m) {
          const day = parseInt(m[1]);
          let year = m[2] ? parseInt(m[2]) : now.getFullYear();
          if (new Date(year, idx, day) < now && !m[2]) year++;
          return makeDate(year, idx, day, hour, min);
        }
      }

      const inX = base.match(/^in\s+(\d+)\s+(day|days|hour|hours|week|weeks)$/);
      if (inX) {
        const n = parseInt(inX[1]);
        const unit = inX[2];
        const d = new Date(now);
        if (unit.startsWith("hour")) { d.setTime(d.getTime() + n * MS_HOUR); return formatISOLocal(d); }
        if (unit.startsWith("week")) d.setDate(d.getDate() + n * 7);
        else d.setDate(d.getDate() + n);
        return makeDate(d.getFullYear(), d.getMonth(), d.getDate(), hour, min);
      }

      const slashDate = base.match(/^(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?$/);
      if (slashDate) {
        const mo = parseInt(slashDate[1]) - 1;
        const day = parseInt(slashDate[2]);
        let year = slashDate[3] ? parseInt(slashDate[3]) : now.getFullYear();
        if (year < 100) year += 2000;
        return makeDate(year, mo, day, hour, min);
      }

      return null;
    }

    function makeDate(y, m, d, h, min) {
      return formatISOLocal(new Date(y, m, d, h, min));
    }

    function splitInput(str) {
      const s = str.trim();
      const patterns = [
        /^(.+?)\s+(in\s+\d+\s+(?:day|days|hour|hours|week|weeks))\s*$/i,
        /^(.+?)\s+((?:next\s+)?(?:sunday|monday|tuesday|wednesday|thursday|friday|saturday)(?:\s+at\s+\d{1,2}(?::\d{2})?\s*(?:am|pm)?)?)\s*$/i,
        /^(.+?)\s+(next\s+week(?:\s+at\s+\d{1,2}(?::\d{2})?\s*(?:am|pm)?)?)\s*$/i,
        /^(.+?)\s+(tomorrow(?:\s+at\s+\d{1,2}(?::\d{2})?\s*(?:am|pm)?)?)\s*$/i,
        /^(.+?)\s+(today(?:\s+at\s+\d{1,2}(?::\d{2})?\s*(?:am|pm)?)?)\s*$/i,
        /^(.+?)\s+(\d{1,2}\/\d{1,2}(?:\/\d{2,4})?(?:\s+(?:at\s+)?\d{1,2}(?::\d{2})?\s*(?:am|pm)?)?)\s*$/i,
        /^(.+?)\s+((?:jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)\w*\s+\d{1,2}(?:[,\s]+\d{4})?(?:\s+(?:at\s+)?\d{1,2}(?::\d{2})?\s*(?:am|pm)?)?)\s*$/i,
      ];
      for (const re of patterns) {
        const m = s.match(re);
        if (m && m[1].trim() && parseDate(m[2].trim())) {
          return { name: m[1].trim(), date: parseDate(m[2].trim()) };
        }
      }
      return null;
    }

    function formatForEdit(d) {
      const dateObj = new Date(d.date);
      const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
      const mo = months[dateObj.getMonth()];
      const day = dateObj.getDate();
      const year = dateObj.getFullYear();
      const h = dateObj.getHours();
      const m = dateObj.getMinutes();
      let time = "";
      if (h !== 9 || m !== 0) {
        const suffix = h >= 12 ? "pm" : "am";
        const h12 = h > 12 ? h - 12 : (h === 0 ? 12 : h);
        time = " at " + h12 + (m > 0 ? ":" + String(m).padStart(2,"0") : "") + suffix;
      }
      return d.name + " " + mo + " " + day + " " + year + time;
    }

    function urgency(days, done, ms) {
      if (done) return {cls: "done", stamp: '<span class="stamp" aria-hidden="true">&#x2605;&#xFE0E;</span>'};
      if (days < 0) return {cls: "past", stamp: '<span class="stamp" aria-hidden="true">&#x2716;</span>'};
      if (ms <= MS_12H) return {cls: "urgent", stamp: '<span class="stamp" aria-hidden="true">&#x26A0;</span>'};
      if (days <= 5) return {cls: "soon", stamp: '<span class="stamp" aria-hidden="true">&#x231B;&#xFE0E;</span>'};
      return {cls: "ok", stamp: ""};
    }

    function formatDoneLabel(iso) {
      const da = new Date(iso);
      const date = da.toLocaleDateString(undefined, {month:"short", day:"numeric"}).toLowerCase();
      const time = da.toLocaleTimeString(undefined, {hour:"numeric", minute:"2-digit"}).toLowerCase();
      return "done " + date + " at " + time;
    }

    // Activate a card via keyboard (Enter/Space) unless it's already in edit mode.
    function activateOnKey(card, activate) {
      card.addEventListener("keydown", (e) => {
        if (!card.classList.contains("editing") && (e.key === "Enter" || e.key === " ")) {
          e.preventDefault(); activate();
        }
      });
    }

    function render() {
      const whens = load();
      whens.sort((a, b) => new Date(a.date) - new Date(b.date));
      const grid = document.getElementById("grid");
      grid.innerHTML = "";
      whens.forEach((d, i) => {
        const t = timeUntil(d.date);
        const {cls, stamp} = urgency(t.days, d.done, t.ms);

        const card = document.createElement("div");
        card.className = "card " + cls + (flashTarget === d.name ? " flash" : "");
        card.tabIndex = 0;
        card.setAttribute("role", "button");
        const dateObj = new Date(d.date);
        const formatted = dateObj.toLocaleDateString(undefined, {weekday:"short", month:"short", day:"numeric", year:"numeric"});
        const timeStr = dateObj.toLocaleTimeString(undefined, {hour:"numeric", minute:"2-digit"});
        let label, number;
        if (d.done) {
          number = "&#x2713;&#xFE0E;";
          label = d.doneAt ? formatDoneLabel(d.doneAt) : "done";
        } else {
          label = t.unit;
          number = t.value;
        }
        let colonBefore = "", colonAfter = "";
        if (!d.done && t.unit === "hours left") colonAfter = '<span class="blink-colon">:</span>';
        else if (!d.done && t.unit === "minutes left") colonBefore = '<span class="blink-colon minutes">:</span>';
        card.innerHTML = stamp + '<div style="display:flex;align-items:start"><span class="card-name">' + escHtml(d.name) + '</span></div>'
          + '<div class="card-date">' + escHtml(formatted + " at " + timeStr) + '</div>'
          + '<div class="card-days">' + colonBefore + number + colonAfter + '</div>'
          + '<span class="label">' + label + '</span>';
        card.addEventListener("click", () => startEdit(card, i));
        activateOnKey(card, () => startEdit(card, i));
        grid.appendChild(card);
      });
      flashTarget = null;
    }

    // Wire an inline textarea: focus (+ optional select-all), Enter=save, Esc=cancel,
    // and for add cards, save/cancel on blur. stopPropagation keeps keys off the card.
    // The `done` latch ensures only the first action wins: cancel/save re-renders away
    // the focused input, which fires a trailing blur — without the latch that blur would
    // re-save a card the user just Escaped.
    function wireInput(input, {onSave, onCancel, selectAll, saveOnBlur}) {
      let done = false;
      const save = () => { if (!done) { done = true; onSave(); } };
      const cancel = () => { if (!done) { done = true; onCancel(); } };
      input.focus();
      if (selectAll) input.setSelectionRange(0, input.value.length);
      input.addEventListener("keydown", (e) => {
        e.stopPropagation();
        if (e.key === "Enter") { e.preventDefault(); save(); }
        if (e.key === "Escape") cancel();
      });
      if (saveOnBlur) {
        input.addEventListener("blur", () => {
          if (input.value.trim()) save(); else cancel();
        });
      }
    }

    function showWhenAdd() {
      const grid = document.getElementById("grid");
      if (document.getElementById("add-input")) { document.getElementById("add-input").focus(); return; }
      const addCard = document.createElement("div");
      addCard.className = "add-card active";
      addCard.innerHTML = '<textarea class="inline-input" id="add-input" rows="2" placeholder="Project proposal due June 15"></textarea>'
        + '<span class="inline-hint">Enter to save. Esc to cancel. No date = today 5pm.</span>';
      grid.appendChild(addCard);
      wireInput(document.getElementById("add-input"), {onSave: doAdd, onCancel: render, saveOnBlur: true});
    }

    function parseWhenInput(val) {
      const result = splitInput(val);
      const now = new Date();
      return {
        name: result ? result.name : val,
        date: result ? result.date : makeDate(now.getFullYear(), now.getMonth(), now.getDate(), 17, 0)
      };
    }

    let addingWhen = false;
    let flashTarget = null;
    function doAdd() {
      if (addingWhen) return;
      const input = document.getElementById("add-input");
      if (!input) return;
      const val = input.value.trim();
      if (!val) { render(); return; }
      const {name, date} = parseWhenInput(val);
      addingWhen = true;
      const whens = load();
      whens.push({name: name, date: date});
      save(whens);
      flashTarget = name;
      render();
      addingWhen = false;
    }

    // Find a When by its original name+date, apply mutate(all, ri), persist, re-render.
    // No-op (just re-renders) if the record is gone.
    function updateWhen(name, date, mutate) {
      const all = load();
      const ri = all.findIndex(x => x.name === name && x.date === date);
      if (ri !== -1) { mutate(all, ri); save(all); }
      render();
    }

    function startEdit(card, idx) {
      if (card.classList.contains("editing")) return;
      card.classList.add("editing");
      card.removeAttribute("role");
      const whens = load();
      whens.sort((a, b) => new Date(a.date) - new Date(b.date));
      const d = whens[idx];
      const origName = d.name, origDate = d.date;
      card.innerHTML = '<textarea class="inline-input" id="edit-input" rows="2">' + escHtml(formatForEdit(d)) + '</textarea>'
        + '<div class="inline-actions"><button id="edit-save">save</button><button id="edit-done">' + (d.done ? "mark undone" : "mark done") + '</button><button id="edit-cancel">cancel</button><button class="card-delete danger" id="edit-delete">delete</button></div>';
      const input = document.getElementById("edit-input");
      function trySave() {
        const val = input.value.trim();
        if (!val) { render(); return; }
        const {name, date} = parseWhenInput(val);
        updateWhen(origName, origDate, (all, ri) => {
          all[ri] = {name: name, date: date, done: all[ri].done, doneAt: all[ri].doneAt};
        });
      }
      wireInput(input, {onSave: trySave, onCancel: render, selectAll: true});
      document.getElementById("edit-save").addEventListener("click", (e) => {
        e.stopPropagation();
        trySave();
      });
      document.getElementById("edit-cancel").addEventListener("click", (e) => {
        e.stopPropagation();
        render();
      });
      document.getElementById("edit-done").addEventListener("click", (e) => {
        e.stopPropagation();
        updateWhen(origName, origDate, (all, ri) => {
          all[ri].done = !d.done;
          if (all[ri].done) all[ri].doneAt = new Date().toISOString();
          else delete all[ri].doneAt;
        });
      });
      document.getElementById("edit-delete").addEventListener("click", (e) => {
        e.stopPropagation();
        updateWhen(origName, origDate, (all, ri) => all.splice(ri, 1));
      });
      card.addEventListener("click", (e) => e.stopPropagation());
      card.addEventListener("keydown", (e) => {
        if (e.key === "Escape") render();
      });
    }

    function renderWhat() {
      const cards = loadWhat();
      const grid = document.getElementById("what-grid");
      grid.innerHTML = "";
      cards.forEach((c, i) => {
        const card = document.createElement("div");
        card.className = "what-card";
        card.tabIndex = 0;
        card.setAttribute("role", "button");
        card.setAttribute("aria-label", c.text);
        card.draggable = true;
        card.dataset.idx = i;
        card.innerHTML = '<span class="what-text">' + escHtml(c.text) + '</span>';
        card.addEventListener("click", () => startWhatEdit(card, i));
        activateOnKey(card, () => startWhatEdit(card, i));
        card.addEventListener("dragstart", (e) => {
          e.dataTransfer.effectAllowed = "move";
          whatDragIdx = i;
          card.classList.add("dragging");
        });
        card.addEventListener("dragend", () => {
          card.classList.remove("dragging");
          if (whatDragIdx === null) return;
          const current = loadWhat();
          const reordered = [...grid.querySelectorAll(".what-card")].map(el => current[parseInt(el.dataset.idx)]);
          saveWhat(reordered);
          whatDragIdx = null;
          renderWhat();
        });
        card.addEventListener("dragover", (e) => {
          e.preventDefault();
          e.dataTransfer.dropEffect = "move";
          const dragging = grid.querySelector(".dragging");
          if (!dragging || dragging === card) return;
          const all = [...grid.querySelectorAll(".what-card")];
          if (all.indexOf(dragging) < all.indexOf(card)) card.after(dragging);
          else card.before(dragging);
        });
        grid.appendChild(card);
      });
    }

    function showWhatAdd() {
      const grid = document.getElementById("what-grid");
      if (document.getElementById("what-add-input")) { document.getElementById("what-add-input").focus(); return; }
      const addCard = document.createElement("div");
      addCard.className = "add-card active";
      addCard.innerHTML = '<textarea class="inline-input" id="what-add-input" rows="3" placeholder="What is top of mind?"></textarea>';
      grid.appendChild(addCard);
      wireInput(document.getElementById("what-add-input"), {onSave: doWhatAdd, onCancel: renderWhat, saveOnBlur: true});
    }

    let addingWhat = false;
    function doWhatAdd() {
      if (addingWhat) return;
      const input = document.getElementById("what-add-input");
      if (!input) return;
      const val = input.value.trim();
      if (!val) { renderWhat(); return; }
      addingWhat = true;
      const cards = loadWhat();
      cards.push({text: val});
      saveWhat(cards);
      renderWhat();
      addingWhat = false;
    }

    function startWhatEdit(card, idx) {
      if (card.classList.contains("editing")) return;
      card.classList.add("editing");
      card.draggable = false; // let the textarea handle drag-to-select
      const cards = loadWhat();
      card.innerHTML = '<textarea class="inline-input" id="what-edit-input" rows="3">' + escHtml(cards[idx].text) + '</textarea>'
        + '<div class="inline-actions"><button id="what-edit-save">save</button><button id="what-edit-cancel">cancel</button><button class="card-delete danger" id="what-edit-delete">delete</button></div>';
      const input = document.getElementById("what-edit-input");
      function trySave() {
        const val = input.value.trim();
        if (!val) { renderWhat(); return; }
        cards[idx] = {text: val};
        saveWhat(cards);
        renderWhat();
      }
      wireInput(input, {onSave: trySave, onCancel: renderWhat, selectAll: true});
      document.getElementById("what-edit-save").addEventListener("click", (e) => {
        e.stopPropagation();
        trySave();
      });
      document.getElementById("what-edit-cancel").addEventListener("click", (e) => {
        e.stopPropagation();
        renderWhat();
      });
      document.getElementById("what-edit-delete").addEventListener("click", (e) => {
        e.stopPropagation();
        cards.splice(idx, 1);
        saveWhat(cards);
        renderWhat();
      });
      card.addEventListener("click", (e) => e.stopPropagation());
      card.addEventListener("keydown", (e) => {
        if (e.key === "Escape") renderWhat();
      });
    }

    function escHtml(s) {
      const d = document.createElement("div");
      d.textContent = s;
      return d.innerHTML;
    }

    function encodeData(obj) {
      return btoa(unescape(encodeURIComponent(JSON.stringify(obj))));
    }
    function decodeData(b64) {
      return JSON.parse(decodeURIComponent(escape(atob(b64))));
    }

    if (location.hash.startsWith("#data=")) {
      try {
        const data = decodeData(location.hash.slice(6));
        const dom = (data.domain || "").toLowerCase().replace(/[^a-z0-9-]/g, "");
        if (data.when) localStorage.setItem(keyFor("when", dom), JSON.stringify(data.when));
        if (data.what) localStorage.setItem(keyFor("what", dom), JSON.stringify(data.what));
        if (typeof data.words === "string") localStorage.setItem(keyFor("words", dom), data.words);
        if (dom === DOMAIN) {
          history.replaceState(null, "", location.pathname);  // same domain: clear hash, no reload
        } else {
          location.replace(location.pathname + "#" + dom);     // different domain: navigate + fresh load
        }
      } catch(e) {
        console.warn("Failed to import data from URL hash", e);
        history.replaceState(null, "", location.pathname);
      }
    }

    if (DOMAIN) {
      document.title = "What & When · " + DOMAIN;
      const label = document.createElement("span");
      label.className = "domain-label";
      label.textContent = DOMAIN;
      document.querySelector(".cluster").prepend(label);
    }

    render();
    renderWhat();
    document.getElementById("when-add-btn").addEventListener("click", showWhenAdd);
    document.getElementById("what-add-btn").addEventListener("click", showWhatAdd);
    addEventListener("hashchange", () => location.reload());
    setInterval(() => {
      if (!document.querySelector(".editing, .add-card")) { render(); renderWhat(); }
    }, 60000);

    const wordsEl = document.getElementById("words-text");
    wordsEl.value = loadWords();
    let wordsTimer = null;
    wordsEl.addEventListener("input", () => {
      clearTimeout(wordsTimer);
      wordsTimer = setTimeout(() => saveWords(wordsEl.value), 300);
    });

    document.getElementById("export-btn").addEventListener("click", function() {
      const data = { domain: DOMAIN, when: load(), what: loadWhat(), words: loadWords() };
      const url = location.origin + location.pathname + "#data=" + encodeData(data);
      const status = document.getElementById("export-status");
      navigator.clipboard.writeText(url).then(() => {
        this.textContent = "copied!";
        status.textContent = "Export URL copied to clipboard";
        setTimeout(() => { this.textContent = "export"; status.textContent = ""; }, 2000);
      }).catch(() => {
        status.textContent = "Copy failed";
        setTimeout(() => { status.textContent = ""; }, 2000);
      });
    });

    const THEME_KEY = "whatandwhen-theme-v1";
    const themeBtn = document.getElementById("theme-btn");
    function applyTheme() {
      const light = document.documentElement.classList.contains("theme-light");
      themeBtn.innerHTML = light ? "&#x263E;" : "&#x2600;&#xFE0E;";
      themeBtn.setAttribute("aria-label", light ? "Switch to dark theme" : "Switch to light theme");
      document.querySelector('meta[name="theme-color"]').setAttribute("content", light ? "#ececec" : "#000");
    }
    themeBtn.addEventListener("click", () => {
      const light = document.documentElement.classList.toggle("theme-light");
      localStorage.setItem(THEME_KEY, light ? "light" : "dark");
      applyTheme();
    });
    applyTheme();
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>DEADLINES</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;700&family=Rubik:wght@400;700;900&family=Rubik+Mono+One&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000;
      --fg: #fff;
      --card-bg: #fff;
      --card-fg: #000;
      --muted: #666;
      --muted-light: #777;
      --border-dim: #444;
      --border-hover: #777;
      --accent: #ffcc00;
      --danger: #ff0000;
      --urgent-bg: #cc2200;
      --soon-bg: #ffcc00;
      --past-bg: #2e2e2e;
      --past-fg: #999;
      --now-bg: #1a1a1a;
      --now-input-bg: #111;
      --card-min-h: 220px;
      --grid-min: 380px;
      --font: "Rubik", sans-serif;
      --font-mono: "Rubik Mono One", monospace;
      --font-scratch: "IBM Plex Mono", monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--fg);
      padding: 2rem;
    }
    h1 {
      font-size: 3rem;
      text-transform: uppercase;
      letter-spacing: .1em;
      margin-bottom: 2rem;
      border-bottom: 6px solid var(--fg);
      padding-bottom: 1rem;
      text-wrap: balance;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(var(--grid-min), 1fr));
      gap: 1.5rem;
    }
    .card {
      background: var(--card-bg);
      color: var(--card-fg);
      padding: 2rem;
      border: 4px solid var(--card-fg);
      outline: 4px solid var(--card-bg);
      display: flex;
      flex-direction: column;
      gap: .75rem;
      min-height: var(--card-min-h);
      justify-content: space-between;
      position: relative;
      overflow: hidden;
      cursor: pointer;
      transition: outline-color .1s;
    }
    .card .stamp { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%) rotate(-18deg); font-size: 14rem; line-height: 1; pointer-events: none; opacity: .15; z-index: 0; }
    .card.urgent .stamp { opacity: .25; }
    .card.soon .stamp { font-size: 16rem; }
    .card > *:not(.stamp) { position: relative; z-index: 1; }
    .card.urgent {
      background: var(--urgent-bg); color: var(--fg); border-color: var(--urgent-bg); outline-color: var(--urgent-bg);
      & .card-date { color: rgba(255,255,255,.75); }
      & .label { color: rgba(255,255,255,.75); }
      & .delete-btn { color: rgba(255,255,255,.6); }
      & .delete-btn:hover { color: var(--fg); }
      & .inline-actions button { color: rgba(255,255,255,.75); }
      & .inline-actions button:hover { color: var(--fg); }
      & .inline-actions button.danger:hover { color: var(--accent); }
      & .inline-input { border-color: rgba(255,255,255,.6); color: var(--fg); }
      & .inline-input:focus { border-color: var(--fg); }
    }
    .card.soon {
      background: var(--soon-bg); color: var(--card-fg); border-color: var(--soon-bg); outline-color: var(--soon-bg);
    }
    .card.past {
      background: var(--past-bg); color: var(--past-fg); border-color: var(--past-bg); outline-color: var(--muted);
      & .card-days { color: var(--muted-light); }
      & .label { color: var(--muted-light); }
    }
    .card-name {
      font-size: 1.4rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .05em;
      text-wrap: balance;
    }
    .card-date {
      font-family: var(--font);
      font-size: 1rem;
      font-weight: 400;
      color: var(--muted);
    }
    .card-days {
      font-family: var(--font-mono);
      font-size: 9rem;
      font-weight: 400;
      line-height: 1;
      letter-spacing: -.04em;
      position: relative;
      display: inline-block;
    }
    .label {
      display: block;
      font-size: 1.2rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: var(--muted);
    }
    @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
    .blink-colon {
      margin-left: -.24em;
      animation: blink 2s step-end infinite;
    }
    .blink-colon.minutes { animation-duration: 1s; }
    @media (prefers-reduced-motion: reduce) {
      .blink-colon { animation: none; }
    }
    .add-card {
      background: transparent;
      border: 2px solid var(--border-dim);
      padding: 2rem;
      min-height: var(--card-min-h);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: border-color .15s;
    }
    .add-card:hover { border-color: var(--border-hover); }
    .add-card .plus {
      font-size: 1.5rem;
      font-weight: 400;
      color: var(--border-dim);
      font-family: var(--font);
      transition: color .15s;
    }
    .add-card:hover .plus { color: var(--border-hover); }
    .add-card.active {
      border-color: var(--fg);
      flex-direction: column;
      align-items: stretch;
      justify-content: start;
      gap: .75rem;
      cursor: default;
      padding: 1.5rem;
    }
    .inline-input {
      width: 100%;
      padding: 1rem;
      border: 2px solid var(--muted);
      background: transparent;
      color: var(--fg);
      font: 400 1.2rem var(--font);
      resize: none;
    }
    .inline-input::placeholder { color: var(--muted); font-weight: 400; font-size: 1.1rem; }
    .inline-input:focus { outline: none; border-color: var(--fg); }
    .inline-hint {
      font-family: var(--font);
      font-size: .85rem;
      font-weight: 400;
      color: var(--muted);
    }
    .inline-error {
      font-family: var(--font);
      font-size: .8rem;
      font-weight: 700;
      color: var(--danger);
    }
    .inline-actions { display: flex; align-items: center; gap: .75rem; margin-top: .5rem; }
    .inline-actions button {
      padding: .4rem .75rem;
      border: none;
      background: transparent;
      color: var(--muted);
      font: 400 .95rem var(--font);
      cursor: pointer;
      text-decoration: underline;
      min-height: 44px;
      min-width: 44px;
    }
    .inline-actions button:hover { color: var(--fg); }
    .inline-actions button.danger { color: var(--muted-light); }
    .inline-actions button.danger:hover { color: var(--danger); text-decoration: underline; }
    .card.ok {
      & .inline-actions button { color: var(--past-fg); }
      & .inline-actions button:hover { color: var(--card-fg); }
      & .inline-actions button.danger:hover { color: var(--danger); }
      & .inline-input { border-color: #ccc; color: var(--card-fg); }
      & .inline-input:focus { border-color: var(--card-fg); }
      & .inline-error { color: var(--danger); }
    }
    .card.soon {
      & .inline-actions button { color: var(--muted-light); }
      & .inline-actions button:hover { color: var(--card-fg); }
      & .inline-actions button.danger:hover { color: var(--danger); }
      & .inline-input { border-color: var(--past-fg); color: var(--card-fg); }
      & .inline-input:focus { border-color: var(--card-fg); }
    }
    .card:hover, .card:focus { outline-color: var(--accent); }
    .card:focus { outline-style: solid; }
    .card.soon:hover, .card.soon:focus { outline-color: var(--fg); }
    .card.editing { outline-color: var(--fg); cursor: default; justify-content: center; }
    .now-card.editing { justify-content: center; }
    .now-card:focus { border-color: var(--accent); outline: 2px solid var(--accent); outline-offset: 2px; }
    .add-card:focus { border-color: var(--border-hover); outline: 2px solid var(--accent); outline-offset: 2px; }
    .now-add:focus { border-color: var(--muted); outline: 2px solid var(--accent); outline-offset: 2px; }
    .delete-btn {
      background: none;
      border: none;
      color: var(--past-fg);
      font-size: 1.5rem;
      font-weight: 900;
      cursor: pointer;
      padding: 0 .5rem;
      line-height: 1;
      margin-left: auto;
    }
    .delete-btn:hover { color: var(--danger); }
    h2 {
      font-size: 3rem;
      text-transform: uppercase;
      letter-spacing: .1em;
      margin-bottom: 2rem;
      padding-bottom: 1rem;
      border-bottom: 6px solid var(--fg);
      text-wrap: balance;
    }
    .bottom-sections {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(var(--grid-min), 1fr));
      gap: 1.5rem;
      margin-top: 3rem;
    }
    .today-section {
      grid-column: span 2;
      display: flex;
      flex-direction: column;
    }
    .now-section {
      grid-column: span 2;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    #today-text {
      flex: 1;
      min-height: 300px;
      font-family: var(--font-scratch);
      font-size: 2rem;
      background: var(--now-bg);
      color: var(--fg);
      border: 2px solid var(--border-dim);
      padding: 1.5rem;
      resize: none;
      line-height: 1.6;
    }
    #today-text::placeholder { color: var(--muted); }
    #today-text:focus { outline: none; border-color: var(--accent); }
    @media (max-width: 900px) {
      .today-section, .now-section { grid-column: 1 / -1; }
    }
    .now-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(var(--grid-min), 1fr));
      gap: 1.5rem;
    }
    .now-card {
      background: var(--now-bg);
      color: var(--fg);
      padding: 2rem;
      border: 2px solid var(--border-dim);
      cursor: pointer;
      min-height: var(--card-min-h);
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
      transition: border-color .15s, transform .15s;
    }
    .now-card:hover { border-color: var(--accent); }
    .now-card.dragging { opacity: .3; transform: scale(.95); }
    .now-card.editing { border-color: var(--fg); cursor: default; }
    .now-card .now-text {
      font-size: 3rem;
      font-weight: 400;
      line-height: 1.2;
      white-space: pre-line;
    }
    .now-card .inline-input { border-color: var(--muted); background: var(--now-input-bg); color: var(--fg); }
    .now-card .inline-input:focus { border-color: var(--accent); }
    .now-card .inline-actions button { border-color: var(--muted); color: var(--past-fg); }
    .now-card .inline-actions button:hover { border-color: var(--fg); color: var(--fg); }
    .now-card .inline-actions button.danger:hover { border-color: var(--danger); color: var(--danger); }
    .now-add {
      background: transparent;
      border: 2px solid #222;
      padding: 2rem;
      min-height: var(--card-min-h);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: border-color .15s;
    }
    .now-add:hover { border-color: var(--muted); }
    .now-add .plus { font-size: 1rem; font-weight: 400; color: var(--muted); }
    .now-add:hover .plus { color: var(--muted-light); }
    .now-add.active {
      border-color: var(--fg);
      flex-direction: column;
      align-items: stretch;
      justify-content: start;
      gap: .5rem;
      cursor: default;
      padding: 1.25rem;
    }
    .export-bar {
      margin-top: 3rem;
      text-align: right;
    }
    .export-bar button {
      background: none;
      border: none;
      color: var(--muted);
      font: 400 .85rem var(--font);
      text-decoration: underline;
      cursor: pointer;
    }
    .export-bar button:hover { color: var(--fg); }
  </style>
</head>
<body>
  <h1>Deadlines</h1>
  <div class="grid" id="grid"></div>
  <div class="bottom-sections">
    <section class="today-section">
      <h2>Today</h2>
      <textarea id="today-text" placeholder="Scratch space…"></textarea>
    </section>
    <section class="now-section">
      <h2>Now</h2>
      <div class="now-grid" id="now-grid"></div>
    </section>
  </div>
  <footer class="export-bar"><button id="export-btn">export</button></footer>
  <script>
    let nowDragIdx = null;
    function formatISOLocal(dt) {
      const p = n => String(n).padStart(2, "0");
      return dt.getFullYear() + "-" + p(dt.getMonth() + 1) + "-" + p(dt.getDate())
        + "T" + p(dt.getHours()) + ":" + p(dt.getMinutes());
    }

    function makeSeed() {
      const now = new Date();
      function daysFromNow(days, hour) {
        const dt = new Date(now);
        dt.setDate(dt.getDate() + days);
        dt.setHours(hour || 9, 0, 0, 0);
        return formatISOLocal(dt);
      }
      return [
        {name: "Send contract to legal", date: formatISOLocal(new Date(now.getTime() + 38 * 60000))},
        {name: "Submit quarterly report", date: formatISOLocal(new Date(now.getTime() + 4 * 3600000))},
        {name: "Design review with team", date: daysFromNow(5, 10)},
        {name: "Launch blog post", date: daysFromNow(14, 9)},
        {name: "Renew domain registration", date: daysFromNow(30, 9)}
      ];
    }

    const NOW_SEED = [
      {text: "Prep talking points for 1:1"},
      {text: "Reply to Slack thread on launch plan"},
      {text: "Read RFC on new auth flow"}
    ];

    const KEY = "deadline-dashboard-v1";
    const NOW_KEY = "now-cards-v1";

    function load() {
      const raw = localStorage.getItem(KEY);
      if (raw) return JSON.parse(raw);
      const seed = makeSeed();
      save(seed);
      return seed;
    }

    function save(deadlines) {
      localStorage.setItem(KEY, JSON.stringify(deadlines));
    }

    function loadNow() {
      const raw = localStorage.getItem(NOW_KEY);
      if (raw) return JSON.parse(raw);
      saveNow(NOW_SEED);
      return NOW_SEED;
    }

    function saveNow(cards) {
      localStorage.setItem(NOW_KEY, JSON.stringify(cards));
    }

    const TODAY_KEY = "today-text-v1";
    function loadToday() { return localStorage.getItem(TODAY_KEY) || ""; }
    function saveToday(text) { localStorage.setItem(TODAY_KEY, text); }

    function timeUntil(dateStr) {
      const ms = new Date(dateStr) - new Date();
      const days = Math.ceil(ms / 86400000);
      if (ms <= 0) return {value: Math.abs(days), unit: "days ago", days};
      if (ms >= 86400000) return {value: days, unit: "days left", days};
      if (ms >= 3600000) return {value: Math.ceil(ms / 3600000), unit: "hours left", days: 0};
      return {value: Math.max(1, Math.ceil(ms / 60000)), unit: "minutes left", days: 0};
    }

    const MONTHS = {jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11,
      january:0,february:1,march:2,april:3,june:5,july:6,august:7,september:8,october:9,november:10,december:11};
    const DAYS = {sun:0,mon:1,tue:2,wed:3,thu:4,fri:5,sat:6,
      sunday:0,monday:1,tuesday:2,wednesday:3,thursday:4,friday:5,saturday:6};

    function parseDate(str) {
      const s = str.trim().toLowerCase();
      const now = new Date();
      let hour = 9, min = 0;

      const timeMatch = s.match(/(?:at\s+)?(\d{1,2})(?::(\d{2}))?\s*(am|pm)?/);
      if (timeMatch) {
        hour = parseInt(timeMatch[1]);
        min = timeMatch[2] ? parseInt(timeMatch[2]) : 0;
        if (timeMatch[3] === "pm" && hour < 12) hour += 12;
        if (timeMatch[3] === "am" && hour === 12) hour = 0;
      }
      const hasTime = !!timeMatch && (timeMatch[3] || timeMatch[2] || parseInt(timeMatch[1]) !== parseInt(s.match(/\d+/)?.[0]));

      if (s === "today") {
        return makeDate(now.getFullYear(), now.getMonth(), now.getDate(), hour, min);
      }
      if (s === "tomorrow") {
        const d = new Date(now); d.setDate(d.getDate() + 1);
        return makeDate(d.getFullYear(), d.getMonth(), d.getDate(), hour, min);
      }

      function nextWeekday(dayName) {
        const target = DAYS[dayName];
        if (target === undefined) return null;
        const d = new Date(now);
        let diff = target - d.getDay();
        if (diff <= 0) diff += 7;
        d.setDate(d.getDate() + diff);
        return makeDate(d.getFullYear(), d.getMonth(), d.getDate(), hour, min);
      }

      if (s === "next week" || s.startsWith("next week ")) {
        const d = new Date(now);
        let diff = 1 - d.getDay();
        if (diff <= 0) diff += 7;
        d.setDate(d.getDate() + diff);
        if (!hasTime) { hour = 10; min = 0; }
        return makeDate(d.getFullYear(), d.getMonth(), d.getDate(), hour, min);
      }

      const nextDay = s.match(/^next\s+(\w+)/);
      if (nextDay) { const r = nextWeekday(nextDay[1]); if (r) return r; }

      const bareDay = s.match(/^(\w+?)(?:\s+at\s+\d{1,2}(?::\d{2})?\s*(?:am|pm)?)?$/);
      if (bareDay) { const r = nextWeekday(bareDay[1]); if (r) return r; }

      for (const [name, idx] of Object.entries(MONTHS)) {
        const patterns = [
          new RegExp(name + "\\s+(\\d{1,2})(?:[,\\s]+(\\d{4}))?"),
          new RegExp("(\\d{1,2})\\s+" + name + "(?:[,\\s]+(\\d{4}))?")
        ];
        for (const re of patterns) {
          const m = s.match(re);
          if (m) {
            const day = parseInt(m[1]);
            let year = m[2] ? parseInt(m[2]) : now.getFullYear();
            if (new Date(year, idx, day) < now && !m[2]) year++;
            if (!hasTime) { hour = 9; min = 0; }
            return makeDate(year, idx, day, hour, min);
          }
        }
      }

      const slashDate = s.match(/(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?/);
      if (slashDate) {
        const mo = parseInt(slashDate[1]) - 1;
        const day = parseInt(slashDate[2]);
        let year = slashDate[3] ? parseInt(slashDate[3]) : now.getFullYear();
        if (year < 100) year += 2000;
        if (!hasTime) { hour = 9; min = 0; }
        return makeDate(year, mo, day, hour, min);
      }

      return null;
    }

    function makeDate(y, m, d, h, min) {
      return formatISOLocal(new Date(y, m, d, h, min));
    }

    function splitInput(str) {
      const s = str.trim();
      const patterns = [
        /^(.+?)\s+((?:next\s+)?(?:mon|tue|wed|thu|fri|sat|sun)\w*(?:\s+at\s+\d{1,2}(?::\d{2})?\s*(?:am|pm)?)?)\s*$/i,
        /^(.+?)\s+(tomorrow(?:\s+at\s+\d{1,2}(?::\d{2})?\s*(?:am|pm)?)?)\s*$/i,
        /^(.+?)\s+(today(?:\s+at\s+\d{1,2}(?::\d{2})?\s*(?:am|pm)?)?)\s*$/i,
        /^(.+?)\s+(\d{1,2}\/\d{1,2}(?:\/\d{2,4})?(?:\s+(?:at\s+)?\d{1,2}(?::\d{2})?\s*(?:am|pm)?)?)\s*$/i,
        /^(.+?)\s+((?:jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)\w*\s+\d{1,2}(?:[,\s]+\d{4})?(?:\s+(?:at\s+)?\d{1,2}(?::\d{2})?\s*(?:am|pm)?)?)\s*$/i,
        /^(.+?)\s+(\d{1,2}\s+(?:jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)\w*(?:[,\s]+\d{4})?(?:\s+(?:at\s+)?\d{1,2}(?::\d{2})?\s*(?:am|pm)?)?)\s*$/i,
      ];
      for (const re of patterns) {
        const m = s.match(re);
        if (m && m[1].trim() && parseDate(m[2].trim())) {
          return { name: m[1].trim(), date: parseDate(m[2].trim()) };
        }
      }
      return null;
    }

    function formatForEdit(d) {
      const dateObj = new Date(d.date);
      const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
      const mo = months[dateObj.getMonth()];
      const day = dateObj.getDate();
      const year = dateObj.getFullYear();
      const h = dateObj.getHours();
      const m = dateObj.getMinutes();
      let time = "";
      if (h !== 9 || m !== 0) {
        const suffix = h >= 12 ? "pm" : "am";
        const h12 = h > 12 ? h - 12 : (h === 0 ? 12 : h);
        time = " at " + h12 + (m > 0 ? ":" + String(m).padStart(2,"0") : "") + suffix;
      }
      return d.name + " " + mo + " " + day + " " + year + time;
    }

    function urgency(days) {
      if (days < 0) return {cls: "past", stamp: '<span class="stamp">&#x2716;</span>'};
      if (days <= 2) return {cls: "urgent", stamp: '<span class="stamp">&#x26A0;</span>'};
      if (days <= 7) return {cls: "soon", stamp: '<span class="stamp">&#x231B;&#xFE0E;</span>'};
      return {cls: "ok", stamp: ""};
    }

    function render() {
      const deadlines = load();
      deadlines.sort((a, b) => new Date(a.date) - new Date(b.date));
      const grid = document.getElementById("grid");
      grid.innerHTML = "";
      deadlines.forEach((d, i) => {
        const t = timeUntil(d.date);
        const {cls, stamp} = urgency(t.days);

        const card = document.createElement("div");
        card.className = "card " + cls;
        card.tabIndex = 0;
        card.setAttribute("role", "button");
        card.setAttribute("aria-label", d.name + ", " + t.value + " " + t.unit);
        const dateObj = new Date(d.date);
        const formatted = dateObj.toLocaleDateString(undefined, {weekday:"short", month:"short", day:"numeric", year:"numeric"});
        const timeStr = dateObj.toLocaleTimeString(undefined, {hour:"numeric", minute:"2-digit"});
        let colon = "";
        if (t.unit === "hours left") colon = '<span class="blink-colon">:</span>';
        else if (t.unit === "minutes left") colon = '<span class="blink-colon minutes">:</span>';
        card.innerHTML = stamp + '<div style="display:flex;align-items:start"><span class="card-name">' + escHtml(d.name) + '</span></div>'
          + '<div class="card-date">' + escHtml(formatted + " at " + timeStr) + '</div>'
          + '<div class="card-days">' + t.value + colon + '</div>'
          + '<span class="label">' + t.unit + '</span>';
        card.addEventListener("click", () => startEdit(card, i));
        card.addEventListener("keydown", (e) => {
          if (!card.classList.contains("editing") && (e.key === "Enter" || e.key === " ")) {
            e.preventDefault(); startEdit(card, i);
          }
        });
        grid.appendChild(card);
      });

      const addCard = document.createElement("div");
      addCard.className = "add-card";
      addCard.tabIndex = 0;
      addCard.setAttribute("role", "button");
      addCard.setAttribute("aria-label", "Add new deadline");
      addCard.innerHTML = '<span class="plus">+ new deadline</span>';
      function activateAdd() {
        if (addCard.classList.contains("active")) return;
        addCard.removeAttribute("role");
        addCard.removeAttribute("tabindex");
        addCard.classList.add("active");
        addCard.innerHTML = '<textarea class="inline-input" id="add-input" rows="2" placeholder="Project proposal due June 15"></textarea>'
          + '<span class="inline-hint">Cmd+Enter to save. Esc to cancel.</span>'
          + '<span class="inline-error" id="add-error"></span>';
        const input = document.getElementById("add-input");
        input.focus();
        input.addEventListener("keydown", (e) => {
          e.stopPropagation();
          if ((e.metaKey || e.ctrlKey) && e.key === "Enter") doAdd();
          if (e.key === "Escape") render();
        });
        input.addEventListener("blur", () => {
          if (input.value.trim()) doAdd(); else render();
        });
      }
      addCard.addEventListener("click", activateAdd);
      addCard.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); activateAdd(); }
      });
      grid.appendChild(addCard);
    }

    let addingDeadline = false;
    function doAdd() {
      if (addingDeadline) return;
      const input = document.getElementById("add-input");
      if (!input) return;
      const val = input.value.trim();
      const err = document.getElementById("add-error");
      if (!val) { render(); return; }
      const result = splitInput(val);
      if (!result) { if (err) err.textContent = "Include a date, e.g. \"Report due May 30\""; return; }
      addingDeadline = true;
      const deadlines = load();
      deadlines.push({name: result.name, date: result.date});
      save(deadlines);
      render();
      addingDeadline = false;
    }

    function findDeadline(name, date) {
      const all = load();
      const ri = all.findIndex(x => x.name === name && x.date === date);
      return {all, ri};
    }

    function startEdit(card, idx) {
      if (card.classList.contains("editing")) return;
      card.classList.add("editing");
      card.removeAttribute("role");
      const deadlines = load();
      deadlines.sort((a, b) => new Date(a.date) - new Date(b.date));
      const d = deadlines[idx];
      const origName = d.name, origDate = d.date;
      card.innerHTML = '<textarea class="inline-input" id="edit-input" rows="2">' + escHtml(formatForEdit(d)) + '</textarea>'
        + '<span class="inline-error" id="edit-error"></span>'
        + '<div class="inline-actions"><span class="inline-hint">Cmd+Enter to save. Esc to cancel.</span><button class="danger" id="edit-delete">delete</button></div>';
      const input = document.getElementById("edit-input");
      input.focus();
      input.setSelectionRange(0, input.value.length);
      let saved = false;
      function trySave() {
        if (saved) return;
        saved = true;
        const val = input.value.trim();
        if (!val) { render(); return; }
        const result = splitInput(val);
        if (!result) { saved = false; document.getElementById("edit-error").textContent = "Include a date"; return; }
        const {all, ri} = findDeadline(origName, origDate);
        if (ri !== -1) { all[ri] = {name: result.name, date: result.date}; save(all); }
        render();
      }
      input.addEventListener("keydown", (e) => {
        e.stopPropagation();
        if ((e.metaKey||e.ctrlKey) && e.key === "Enter") trySave();
        if (e.key === "Escape") render();
      });
      input.addEventListener("blur", () => setTimeout(trySave, 100));
      document.getElementById("edit-delete").addEventListener("mousedown", (e) => {
        e.preventDefault(); e.stopPropagation();
        saved = true;
        const {all, ri} = findDeadline(origName, origDate);
        if (ri !== -1) { all.splice(ri, 1); save(all); }
        render();
      });
      card.addEventListener("click", (e) => e.stopPropagation());
    }

    function renderNow() {
      const cards = loadNow();
      const grid = document.getElementById("now-grid");
      grid.innerHTML = "";
      cards.forEach((c, i) => {
        const card = document.createElement("div");
        card.className = "now-card";
        card.tabIndex = 0;
        card.setAttribute("role", "button");
        card.setAttribute("aria-label", c.text);
        card.draggable = true;
        card.dataset.idx = i;
        card.innerHTML = '<span class="now-text">' + escHtml(c.text) + '</span>';
        card.addEventListener("click", () => startNowEdit(card, i));
        card.addEventListener("keydown", (e) => {
          if (!card.classList.contains("editing") && (e.key === "Enter" || e.key === " ")) {
            e.preventDefault(); startNowEdit(card, i);
          }
        });
        card.addEventListener("dragstart", (e) => {
          e.dataTransfer.effectAllowed = "move";
          nowDragIdx = i;
          card.classList.add("dragging");
        });
        card.addEventListener("dragend", () => {
          card.classList.remove("dragging");
          if (nowDragIdx === null) return;
          const els = [...grid.querySelectorAll(".now-card")];
          const reordered = els.map(el => loadNow()[parseInt(el.dataset.idx)]);
          saveNow(reordered);
          nowDragIdx = null;
          renderNow();
        });
        card.addEventListener("dragover", (e) => {
          e.preventDefault();
          e.dataTransfer.dropEffect = "move";
          const dragging = grid.querySelector(".dragging");
          if (!dragging || dragging === card) return;
          const all = [...grid.querySelectorAll(".now-card")];
          if (all.indexOf(dragging) < all.indexOf(card)) card.after(dragging);
          else card.before(dragging);
        });
        grid.appendChild(card);
      });
      const addCard = document.createElement("div");
      addCard.className = "now-add";
      addCard.tabIndex = 0;
      addCard.setAttribute("role", "button");
      addCard.setAttribute("aria-label", "Add new item");
      addCard.innerHTML = '<span class="plus">+ new</span>';
      function activateNowAdd() {
        addCard.removeAttribute("role");
        addCard.removeAttribute("tabindex");
        addCard.classList.add("active");
        addCard.innerHTML = '<textarea class="inline-input" id="now-add-input" rows="3" placeholder="What is top of mind?"></textarea>';
        const input = document.getElementById("now-add-input");
        input.focus();
        input.addEventListener("keydown", (e) => {
          if ((e.metaKey || e.ctrlKey) && e.key === "Enter") doNowAdd();
          if (e.key === "Escape") renderNow();
        });
        input.addEventListener("blur", () => {
          if (input.value.trim()) doNowAdd(); else renderNow();
        });
      }
      addCard.addEventListener("click", activateNowAdd);
      addCard.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); activateNowAdd(); }
      });
      grid.appendChild(addCard);
    }

    let addingNow = false;
    function doNowAdd() {
      if (addingNow) return;
      const input = document.getElementById("now-add-input");
      if (!input) return;
      const val = input.value.trim();
      if (!val) { renderNow(); return; }
      addingNow = true;
      const cards = loadNow();
      cards.push({text: val});
      saveNow(cards);
      renderNow();
      addingNow = false;
    }

    function startNowEdit(card, idx) {
      if (card.classList.contains("editing")) return;
      card.classList.add("editing");
      const cards = loadNow();
      card.innerHTML = '<textarea class="inline-input" id="now-edit-input" rows="3">' + escHtml(cards[idx].text) + '</textarea>'
        + '<div class="inline-actions"><span class="inline-hint">Cmd+Enter to save. Esc to cancel.</span><button class="danger" id="now-edit-delete">delete</button></div>';
      const input = document.getElementById("now-edit-input");
      input.focus();
      input.setSelectionRange(0, input.value.length);
      let saved = false;
      function trySave() {
        if (saved) return;
        saved = true;
        const val = input.value.trim();
        if (!val) { renderNow(); return; }
        cards[idx] = {text: val};
        saveNow(cards);
        renderNow();
      }
      input.addEventListener("keydown", (e) => {
        if ((e.metaKey || e.ctrlKey) && e.key === "Enter") trySave();
        if (e.key === "Escape") renderNow();
      });
      input.addEventListener("blur", () => setTimeout(trySave, 100));
      document.getElementById("now-edit-delete").addEventListener("mousedown", (e) => {
        e.preventDefault();
        e.stopPropagation();
        saved = true;
        cards.splice(idx, 1);
        saveNow(cards);
        renderNow();
      });
      card.addEventListener("click", (e) => e.stopPropagation());
    }

    function escHtml(s) {
      const d = document.createElement("div");
      d.textContent = s;
      return d.innerHTML;
    }

    if (location.hash.startsWith("#data=")) {
      try {
        const json = atob(location.hash.slice(6));
        const data = JSON.parse(json);
        if (data.deadlines) save(data.deadlines);
        if (data.now) saveNow(data.now);
        if (data.today) saveToday(data.today);
      } catch(e) { console.warn("Failed to import data from URL hash", e); }
      history.replaceState(null, "", location.pathname);
    }

    render();
    renderNow();
    setInterval(() => { render(); renderNow(); }, 60000);

    const todayEl = document.getElementById("today-text");
    todayEl.value = loadToday();
    let todayTimer = null;
    todayEl.addEventListener("input", () => {
      clearTimeout(todayTimer);
      todayTimer = setTimeout(() => saveToday(todayEl.value), 300);
    });

    document.getElementById("export-btn").addEventListener("click", function() {
      const data = { deadlines: load(), now: loadNow(), today: loadToday() };
      const url = location.origin + location.pathname + "#data=" + btoa(JSON.stringify(data));
      navigator.clipboard.writeText(url).then(() => {
        this.textContent = "copied!";
        setTimeout(() => { this.textContent = "export"; }, 2000);
      });
    });
  </script>
</body>
</html>
